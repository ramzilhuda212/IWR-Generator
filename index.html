                            <tr><td class="p-2 border font-semibold bg-gray-50">Kelas / Jenjang / Fase</td><td class="p-2 border">${kelasText} (${cp.fase})</td></tr>
                            <tr><td class="p-2 border font-semibold bg-gray-50">Alokasi Waktu</td><td class="p-2 border">${cp.alokasi_rph} (1 Pertemuan)</td></tr>
                            <tr><td class="p-2 border font-semibold bg-gray-50">Jumlah Peserta Didik</td><td class="p-2 border">${cp.jumlah_murid} per kelompok/halaqah</td></tr>
                            <tr><td class="p-2 border font-semibold bg-gray-50">Guru Pengajar</td><td class="p-2 border">${namaGuru}</td></tr>
                            <tr><td class="p-2 border font-semibold bg-gray-50">Integrasi Pendekatan 7T</td><td class="p-2 border font-bold text-jsit">Tahsin, Tilawah, Tahfizh, Tafsir, Tadabbur, Tathbiq, Ta'allama wa 'Allama</td></tr>
                        </table>
                    </div>

                    <div class="mb-6">
                        <h4 class="font-bold text-sm bg-green-100 text-green-900 px-3 py-1.5 rounded mb-3 border-l-4 border-jsit">BAGIAN II. CAPAIAN PEMBELAJARAN SESUAI DOKUMEN CP IWR 2026</h4>
                        <table class="w-full text-xs border-collapse border border-gray-300">
                            <tr class="bg-gray-50"><th class="border p-2 w-1/4">Aspek</th><th class="border p-2 w-1/2">Capaian Pembelajaran (CP Dokumen Resmi)</th><th class="border p-2 w-1/4">Target Pertemuan Ini</th></tr>
                            <tr><td class="border p-2 font-bold text-green-900">Adab dan Santun</td><td class="border p-2">${cp.santun_taat}</td><td class="border p-2 font-semibold text-jsit">Mempraktikkan adab membawa/meletakkan mushaf & mutaba'ah harian.</td></tr>
                            <tr><td class="border p-2 font-bold text-green-900">Hafalan (Tahfizh Ziadah & Muroja'ah)</td><td class="border p-2">${cp.fasih_menghafal}</td><td class="border p-2 font-semibold text-jsit">Menghafal & melafalkan ${materiZiadahRph} dengan tartil serta Muroja'ah.</td></tr>
                            <tr><td class="border p-2 font-bold text-green-900">Kandungan Surat</td><td class="border p-2">${cp.fasih_memahami}</td><td class="border p-2 font-semibold text-jsit">Menjelaskan arti nama surat & pesan moral harian.</td></tr>
                            <tr><td class="border p-2 font-bold text-green-900">Bacaan (Jilid/Tilawah)</td><td class="border p-2">${cp.fasih_membaca}</td><td class="border p-2 font-semibold text-jsit">Melafalkan materi ${materiJilidRph} sesuai tajwid.</td></tr>
                        </table>
                    </div>

                    <div class="mb-6">
                        <h4 class="font-bold text-sm bg-green-100 text-green-900 px-3 py-1.5 rounded mb-3 border-l-4 border-jsit">BAGIAN III. LANGKAH-LANGKAH PEMBELAJARAN (5 TAHAPAN & 7 LANGKAH TALAQQI)</h4>
                        
                        <div class="space-y-4 text-xs">
                            <div class="border p-3 rounded-lg bg-green-50/50">
                                <span class="font-bold text-jsit uppercase">Langkah 1: Pembukaan (Kesiapan Spiritual)</span>
                                <p class="mt-1">Pendidik mengucapkan salam, menanyakan kabar, memastikan kesiapan (wudhu & mushaf). Memimpin syahadat & selawat, membaca Surah Al-Fatihah dan Doa Penawar Hati bersama, serta Ice Breaking (Tepuk/Yel-Yel IWR / Tebak Ayat).</p>
                            </div>

                            <div class="border p-3 rounded-lg">
                                <span class="font-bold text-jsit uppercase">Langkah 2: Inti Capaian Santun (7 Langkah Adab)</span>
                                <ol class="list-decimal list-inside space-y-1 text-gray-700 mt-1 pl-2">
                                    <li><strong>Pengulangan:</strong> Pendidik mengonfirmasi komitmen pelaksanaan adab santun harian.</li>
                                    <li><strong>Mencontohkan & Ditirukan:</strong> Pendidik mencontohkan cara membawa mushaf di dada dengan tangan kanan & meletakkan di tempat tinggi. Murid menirukan.</li>
                                    <li><strong>Menjelaskan:</strong> Pendidik menjelaskan alasan memuliakan Al-Qur'an sebagai Kalamullah.</li>
                                    <li><strong>Menunjuk Sebagian:</strong> Menunjuk sebagian murid mempraktikkan adab santun.</li>
                                    <li><strong>Membaca/Praktik Berkelompok:</strong> Meminta kelompok mempraktikkan secara bergantian.</li>
                                    <li><strong>Membaca/Praktik Bersama:</strong> Seluruh peserta didik mempraktikkan bersama-sama.</li>
                                    <li><strong>Menilai:</strong> Peserta didik mempraktikkan satu per satu; pendidik mencatat di jurnal sikap.</li>
                                </ol>
                            </div>

                            <div class="border p-3 rounded-lg">
                                <span class="font-bold text-jsit uppercase">Langkah 3: Energizer / Ice Breaking</span>
                                <p class="mt-1">Tepuk IWR & Yel-Yel Pecinta Qur'an untuk menyegarkan fokus murid.</p>
                            </div>

                            <div class="border p-3 rounded-lg">
                                <span class="font-bold text-jsit uppercase">Langkah 4: Inti Hafalan (7 Langkah Tahfizh Ziadah & Muroja'ah: ${materiZiadahRph})</span>
                                <ol class="list-decimal list-inside space-y-1 text-gray-700 mt-1 pl-2">
                                    <li><strong>Mengulang:</strong> Muroja'ah bersama hafalan ayat/surat sebelumnya.</li>
                                    <li><strong>Mencontohkan & Ditirukan:</strong> Pendidik membacakan ayat baru ${materiZiadahRph} minimal 3x dengan tartil. Murid menyimak & menirukan.</li>
                                    <li><strong>Menjelaskan:</strong> Pendidik menjelaskan arti kata, jumlah ayat, dan kandungan singkat.</li>
                                    <li><strong>Menunjuk Sebagian:</strong> Menunjuk sebagian murid untuk melafalkan ayat baru.</li>
                                    <li><strong>Membaca Berkelompok:</strong> Melafalkan ayat baru secara berkelompok (putra/putri).</li>
                                    <li><strong>Membaca Bersama:</strong> Seluruh murid melafalkan ayat baru bersama-sama.</li>
                                    <li><strong>Menilai:</strong> Menyimak setoran hafalan baru murid secara individual/bergiliran.</li>
                                </ol>
                            </div>

                            <div class="border p-3 rounded-lg">
                                <span class="font-bold text-jsit uppercase">Langkah 5: Inti Materi Jilid / Tilawah / Tajwid (7 Langkah Bacaan: ${materiJilidRph})</span>
                                <ol class="list-decimal list-inside space-y-1 text-gray-700 mt-1 pl-2">
                                    <li><strong>Mengulang:</strong> Mengulang materi 3-5 halaman sebelumnya.</li>
                                    <li><strong>Mencontohkan & Ditirukan:</strong> Pendidik mencontohkan bunyi pokok materi di alat peraga/mushaf 3x, murid menirukan.</li>
                                    <li><strong>Menjelaskan:</strong> Pendidik menjelaskan hukum tajwid/harakat dengan kata kunci ringkas.</li>
                                    <li><strong>Menunjuk Sebagian:</strong> Menunjuk murid secara individu membaca baris yang ditunjuk.</li>
                                    <li><strong>Membaca Berkelompok:</strong> Membaca baris latihan berkelompok.</li>
                                    <li><strong>Membaca Bersama:</strong> Membaca satu halaman peraga/tilawah penuh secara bersama.</li>
                                    <li><strong>Menilai:</strong> Pendidik menyimak dan menilai bacaan murid secara individual.</li>
                                </ol>
                            </div>

                            <div class="border p-3 rounded-lg bg-green-50/50">
                                <span class="font-bold text-jsit uppercase">Langkah 6 & 7: Penutup (Refleksi & Doa)</span>
                                <p class="mt-1">Muroja'ah bersama kesimpulan hafalan & jilid hari ini, memberikan penugasan membuat jadwal muroja'ah di rumah bersama orang tua, membaca Doa Kaffaratul Majlis bersama, dan salam penutup.</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h4 class="font-bold text-sm bg-green-100 text-green-900 px-3 py-1.5 rounded mb-3 border-l-4 border-jsit">BAGIAN IV. STANDAR PENILAIAN (RUBRIK IWR BP2Q JSIT)</h4>
                        <table class="w-full text-xs border-collapse border border-gray-300">
                            <thead>
                                <tr class="bg-gray-100"><th class="border p-2">Aspek</th><th class="border p-2">Teknik Penilaian</th><th class="border p-2">Instrumen & Indikator</th></tr>
                            </thead>
                            <tbody>
                                <tr><td class="border p-2 font-semibold">Adab dan Santun</td><td class="border p-2">Observasi langsung & Mutaba'ah</td><td class="border p-2">Buku Prestasi Santun (Skor 1-4: Teladan, Mandiri, Terbimbing, Perlu Bimbingan)</td></tr>
                                <tr><td class="border p-2 font-semibold">Hafalan (Tahfizh Ziadah & Muroja'ah)</td><td class="border p-2">Tes Lisan Individual (Tasmi')</td><td class="border p-2">Kelancaran, Makhorijul Huruf & Tajwid Presisi (Skor Maks 30)</td></tr>
                                <tr><td class="border p-2 font-semibold">Bacaan (Jilid/Tilawah)</td><td class="border p-2">Tes Lisan Individual</td><td class="border p-2">Rubrik Jilid/Tilawah (Makhraj, Tajwid, & Kelancaran)</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-8 flex justify-between text-xs text-center font-semibold">
                        <div>
                            <p>Mengetahui,</p>
                            <p>Kepala ${namaSekolah}</p>
                            <br><br><br>
                            <p class="underline font-bold">${namaKepala}</p>
                        </div>
                        <div>
                            <p>Kebumen, Juli 2026</p>
                            <p>Guru Al-Qur'an (IWR)</p>
                            <br><br><br>
                            <p class="underline font-bold">${namaGuru}</p>
                        </div>
                    </div>
                `;
            }
        }

        window.onload = function() {
            populateKelasOptions();
            onKelasChange();
        };
    </script>
</body>
